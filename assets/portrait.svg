<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Portrait placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141922"/>
      <stop offset="0.55" stop-color="#0E1219"/>
      <stop offset="1" stop-color="#0A0D12"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#C8A96A" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C8A96A" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grain" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="9" r="0.7" fill="#ffffff" opacity="0.05"/>
      <circle cx="31" cy="22" r="0.6" fill="#ffffff" opacity="0.04"/>
      <circle cx="48" cy="41" r="0.7" fill="#ffffff" opacity="0.05"/>
      <circle cx="17" cy="47" r="0.5" fill="#ffffff" opacity="0.03"/>
      <circle cx="39" cy="4" r="0.6" fill="#ffffff" opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <rect width="800" height="1000" fill="url(#grain)"/>

  <!-- frame lines -->
  <rect x="40" y="40" width="720" height="920" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
  <line x1="40" y1="760" x2="760" y2="760" stroke="#C8A96A" stroke-opacity="0.22"/>

  <!-- monogram -->
  <text x="400" y="470" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="230" fill="#EDEAE3" fill-opacity="0.92" letter-spacing="6">ML</text>

  <text x="400" y="560" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="17" fill="#C8A96A" letter-spacing="9">DOMAIN BROKER</text>

  <text x="400" y="820" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="14" fill="#97938A" letter-spacing="5">PORTRAIT — REPLACE WITH PHOTO</text>
  <text x="400" y="852" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="12" fill="#6E6A63" letter-spacing="3">建议 4:5 竖版 · 自然光 · 深色背景</text>
</svg>
