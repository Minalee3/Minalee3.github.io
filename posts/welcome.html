      <h1>开始写博客：从零搭起 GitHub Pages</h1>
      <div class="post-meta"><time datetime="2026-10-20">2026 年 10 月 20 日</time></div>
      <p>这是我写下的第一篇文章。搭建这个博客的过程并不复杂：</p>
      <p>1. 在本机安装 git；<br>2. 生成 SSH key 并添加到 GitHub；<br>3. 创建 <code>用户名.github.io</code> 仓库；<br>4. 把静态页面 push 上去，GitHub Pages 自动发布。</p>
      <p>以后我会在这里分享更多内容。欢迎常来。</p>
